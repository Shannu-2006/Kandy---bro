<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="damruGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <radialGradient id="divineAura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <filter id="goldenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="200" cy="220" r="180" fill="url(#divineAura)" opacity="0.6" />

  <!-- THE TRISHUL (SHIVA'S TRIDENT) -->
  <g filter="url(#goldenGlow)">
    
    <!-- Long Sacred Shaft -->
    <rect x="194" y="220" width="12" height="640" rx="4" fill="url(#shaftGrad)" />

    <!-- Shaft Decorative Rings -->
    <rect x="188" y="240" width="24" height="6" rx="2" fill="url(#goldMetallic)" />
    <rect x="190" y="380" width="20" height="4" rx="2" fill="url(#goldMetallic)" />
    <rect x="190" y="550" width="20" height="4" rx="2" fill="url(#goldMetallic)" />
    <rect x="190" y="700" width="20" height="4" rx="2" fill="url(#goldMetallic)" />

    <!-- Shaft Bottom Spike -->
    <polygon points="194,860 206,860 200,895" fill="url(#bladeGrad)" />

    <!-- Central Trishul Hub / Lotus Base -->
    <path d="M170,225 C170,205 185,195 200,195 C215,195 230,205 230,225 C230,240 215,245 200,245 C185,245 170,240 170,225 Z" fill="url(#goldMetallic)" />
    
    <!-- Central Blade -->
    <!-- Pointed spear head with realistic center ridge -->
    <path d="M192,200 L190,100 L200,30 L210,100 L208,200 Z" fill="url(#bladeGrad)" />
    <line x1="200" y1="30" x2="200" y2="200" stroke="#fef08a" stroke-width="2" />

    <!-- Left Curved Blade -->
    <path d="M188,215 C160,215 110,180 100,105 C98,80 102,60 105,50 C110,85 130,135 175,150 L180,190 Z" fill="url(#bladeGrad)" />
    <!-- Left outer flame barb -->
    <path d="M105,50 C115,75 125,90 140,95 C125,100 115,115 110,140 C105,115 90,85 105,50 Z" fill="url(#goldMetallic)" />

    <!-- Right Curved Blade -->
    <path d="M212,215 C240,215 290,180 300,105 C302,80 298,60 295,50 C290,85 270,135 225,150 L220,190 Z" fill="url(#bladeGrad)" />
    <!-- Right outer flame barb -->
    <path d="M295,50 C285,75 275,90 260,95 C275,100 285,115 290,140 C295,115 310,85 295,50 Z" fill="url(#goldMetallic)" />

    <!-- Sacred Tripundra (Three Lines) on Center Blade -->
    <path d="M190,130 L210,130" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <path d="M189,136 L211,136" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <path d="M190,142 L210,142" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <!-- Vermilion Kumkum Bindu -->
    <circle cx="200" cy="136" r="2.5" fill="#ef4444" />

    <!-- Sacred Crescent Moon (Chandrama) Resting on Hub -->
    <path d="M175,185 C175,170 190,162 200,162 C210,162 225,170 225,185 C215,175 205,173 200,173 C195,173 185,175 175,185 Z" fill="#ffffff" filter="url(#intenseGlow)" opacity="0.95" />

    <!-- SHIVA'S DAMRU (Hourglass Drum) Tied to the Shaft -->
    <g transform="translate(0, 40)">
      <!-- Left side drum cone -->
      <path d="M170,255 L200,275 L170,295 Z" fill="url(#damruGrad)" stroke="#f59e0b" stroke-width="1.5" />
      <ellipse cx="170" cy="275" rx="5" ry="20" fill="#fde68a" stroke="#78350f" stroke-width="1" />

      <!-- Right side drum cone -->
      <path d="M230,255 L200,275 L230,295 Z" fill="url(#damruGrad)" stroke="#f59e0b" stroke-width="1.5" />
      <ellipse cx="230" cy="275" rx="5" ry="20" fill="#fde68a" stroke="#78350f" stroke-width="1" />

      <!-- Drum cords (cross weaving) -->
      <line x1="170" y1="260" x2="230" y2="290" stroke="#f59e0b" stroke-width="1" opacity="0.8" />
      <line x1="170" y1="290" x2="230" y2="260" stroke="#f59e0b" stroke-width="1" opacity="0.8" />

      <!-- Center tie band -->
      <rect x="196" y="270" width="8" height="10" rx="2" fill="#dc2626" />
      
      <!-- Hanging cords with golden beads -->
      <path d="M198,280 Q190,310 182,325" stroke="#fef08a" stroke-width="1.5" fill="none" />
      <circle cx="182" cy="325" r="4" fill="#f59e0b" />
      
      <path d="M202,280 Q212,315 220,330" stroke="#fef08a" stroke-width="1.5" fill="none" />
      <circle cx="220" cy="330" r="4" fill="#f59e0b" />

      <!-- Sacred Rudraksha Bead on the neck -->
      <circle cx="200" cy="250" r="7" fill="#78350f" stroke="#451a03" stroke-width="1" />
      <circle cx="200" cy="250" r="5" fill="#92400e" />
    </g>
  </g>
</svg>
